name: Coverage pilot - NetBox VM E2E (issue 159)

# Temporary next-release experiment. Do not merge this branch-specific trigger.
on:
  push:
    branches: ['ci/159-coverage-baseline']
    paths:
      - '.github/workflows/coverage-vm-pilot.yml'
      - 'scripts/ci/netbox-vm-coverage.sh'
      - 'scripts/ci/netbox-vm-host.sh'
      - 'scripts/ci/netbox-vm-e2e.sh'

concurrency:
  group: coverage-pilot-vm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Instrumented baseline E2E and two isolated boots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate shell scripts and baseline version
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/netbox-vm-host.sh scripts/ci/netbox-vm-guest.sh scripts/ci/netbox-vm-e2e.sh scripts/ci/netbox-vm-coverage.sh
          source scripts/ci/netbox-vm-baseline.env
          if [[ ! "$BASELINE_TAG" =~ ^netbox-ubuntu2404-netbox[0-9]+-schema-v[0-9]+$ ]]; then
            echo '::error::Invalid baseline tag'
            exit 1
          fi
          echo "Pinned baseline: $BASELINE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Install virtualization tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Download versioned baseline from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/netbox-vm-baseline.env
          mkdir -p "$RUNNER_TEMP/netbox-ci"
          start=$SECONDS
          gh release download "$BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/netbox-ci" \
            --pattern netbox-ubuntu24.qcow2 \
            --pattern SHA256SUMS.txt
          cd "$RUNNER_TEMP/netbox-ci"
          test -s netbox-ubuntu24.qcow2
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo "Baseline download + verification: $((SECONDS-start)) s"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$BASELINE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify two isolated NetBox boots
        env:
          NETBOX_VM_E2E: '1'
          NETBOX_VM_COVERAGE: '1'
        run: bash scripts/ci/netbox-vm-host.sh verify

      - name: Upload separate E2E coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-vm-baseline
          path: ${{ runner.temp }}/netbox-ci/coverage-e2e/
          if-no-files-found: error
          retention-days: 30
