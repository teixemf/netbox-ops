name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unittest:
    name: Python 3.12 / unittest
    runs-on: ubuntu-latest
    # Tests validate root-owned backup paths (0700); keep UID 0 inside a disposable container.
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
