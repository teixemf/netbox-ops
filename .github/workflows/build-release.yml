name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Planned stable release tag (e.g. v0.6.0); no tag is created'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Check planned tag and source branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          test "$SOURCE_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

  tests:
    needs: preflight
    uses: ./.github/workflows/tests.yml

  package:
    name: Validate and build release candidate
    needs: [preflight, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/build-release.sh
          bash scripts/build-release.sh
          archive="dist/netbox-ops-$RELEASE_TAG.tar.gz"
          python3 scripts/release-candidate.py validate "$archive" "$RELEASE_TAG"

      - name: Upload validated release candidate
        uses: actions/upload-artifact@v4
        with:
          name: netbox-ops-${{ inputs.tag }}
          path: |
            dist/netbox-ops-${{ inputs.tag }}.tar.gz
            dist/netbox-ops-${{ inputs.tag }}.tar.gz.sha256
            dist/netbox-ops-${{ inputs.tag }}.compatibility.json
            dist/netbox-ops-${{ inputs.tag }}.notes.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
