name: Tests

on:
  workflow_call:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  unittest:
    needs: scope
    if: ${{ !cancelled() }}
    name: Python ${{ matrix.python }} / unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    # Keep the matrix check names even when tests are irrelevant. Start the
    # disposable root container only when the Python suite is selected.
    steps:
      - uses: actions/checkout@v5
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.unit != 'false' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run unit and regression tests
        if: ${{ matrix.python != '3.12' && (needs.scope.result != 'success' || needs.scope.outputs.unit != 'false') }}
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            python:${{ matrix.python }}-bookworm \
            bash -ec 'git config --global --add safe.directory /workspace
              bash -n install.sh upgrade.sh uninstall.sh
              python -m unittest discover -s tests -p "test_*.py" -v'
      - name: Run unit and regression tests with coverage
        if: ${{ matrix.python == '3.12' && (needs.scope.result != 'success' || needs.scope.outputs.unit != 'false') }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/netbox-ops-coverage"
          mkdir -p "$report"
          docker run --rm \
            --volume "$PWD:/workspace" \
            --volume "$report:/coverage" \
            --workdir /workspace \
            --env COVERAGE_FILE=/coverage/.coverage \
            python:3.12-bookworm \
            bash -ec 'git config --global --add safe.directory /workspace
              python -m pip install --disable-pip-version-check coverage==7.10.7
              bash -n install.sh upgrade.sh uninstall.sh
              python -m coverage run --branch --source=netbox_ops -m unittest discover -s tests -p "test_*.py" -v
              python -m coverage report -m
              python -m coverage json -o /coverage/coverage.json
              python -m coverage xml -o /coverage/coverage.xml'
          {
            echo '### Full unit/regression coverage (Python 3.12)'
            python3 - "$report/coverage.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as f:
              totals = json.load(f)['totals']
          for label, covered, total in (
              ('Statements', totals['covered_lines'], totals['num_statements']),
              ('Branches', totals['covered_branches'], totals['num_branches']),
          ):
              print(f'- {label}: {covered}/{total} ({100 * covered / total:.2f}%)')
          print(f"- Combined: {totals['percent_covered']:.2f}%")
          PY
            echo 'Reporting only: no minimum percentage enforced.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report changed executable Python lines
        if: ${{ matrix.python == '3.12' && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.unit != 'false') }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/netbox-ops-coverage"
          python3 scripts/ci/coverage_diff.py \
            --pr-event "$GITHUB_EVENT_PATH" \
            --coverage "$report/coverage.json" \
            --output "$report/diff-coverage.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload unit coverage
        if: ${{ matrix.python == '3.12' && (needs.scope.result != 'success' || needs.scope.outputs.unit != 'false') }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-python-3.12
          path: ${{ runner.temp }}/netbox-ops-coverage/
          if-no-files-found: error
          retention-days: 30
      - name: No Python tests required
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.unit == 'false' }}
        run: echo 'No Python or regression test changes'

  lint:
    needs: scope
    if: ${{ !cancelled() }}
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check release metadata
        run: python3 -m unittest tests.test_release_version -v
      - name: Install Ruff
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.unit != 'false' }}
        run: python -m pip install ruff==0.17.6
      - name: Check Python code
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.unit != 'false' }}
        run: ruff check .
      - name: Test real audit log rotation
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.package != 'false' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends logrotate
          sudo python3 -m unittest tests.install.test_logrotate -v
      - name: Check release archive
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.package != 'false' }}
        run: |
          bash -n scripts/build-release.sh
          bash scripts/build-release.sh
          archive="$(find dist -maxdepth 1 -type f -name 'netbox-ops-v*.tar.gz' -print -quit)"
          test -n "$archive"
          tag="$(basename "$archive" .tar.gz)"
          python3 scripts/release-candidate.py validate "$archive" "${tag#netbox-ops-}"
          tar -tzf "$archive" > /tmp/netbox-ops-archive-files
          grep -Fxq 'netbox-ops/install.sh' /tmp/netbox-ops-archive-files
          grep -Fxq 'netbox-ops/netbox_ops.py' /tmp/netbox-ops-archive-files
          if grep -Eq '^netbox-ops/(\.github/|tests/|scripts/)' /tmp/netbox-ops-archive-files; then
            echo 'Unexpected development files in release archive'
            exit 1
          fi
          extracted="$(mktemp -d)"
          tar -xzf "$archive" -C "$extracted"
          test -x "$extracted/netbox-ops/install.sh"
          test -x "$extracted/netbox-ops/upgrade.sh"
          test -x "$extracted/netbox-ops/uninstall.sh"
      - name: Exercise packaged uninstaller in disposable container
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.package != 'false' }}
        run: |
          docker run --rm --network none \
            --volume "$PWD/dist:/release:ro" \
            --volume "$PWD/tests/install/uninstall-smoke.sh:/uninstall-smoke.sh:ro" \
            python:3.12-bookworm bash /uninstall-smoke.sh

  integration:
    needs: scope
    if: ${{ !cancelled() }}
    name: PostgreSQL integration / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
          - distro: Rocky Linux 9
            image: rockylinux:9
    steps:
      - uses: actions/checkout@v5
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.postgres != 'false' }}
        with:
          persist-credentials: false
      - name: No PostgreSQL integration required
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.postgres == 'false' }}
        run: echo 'No PostgreSQL integration changes'
      - name: Run real backup and restore tests
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.postgres != 'false' }}
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            bash tests/integration/run_postgres.sh \
              python3 -m unittest discover -s tests/integration \
              -p 'integration_*.py' -v
