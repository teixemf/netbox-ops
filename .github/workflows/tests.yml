name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unittest:
    name: Python 3.12 / unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
