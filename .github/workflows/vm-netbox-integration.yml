name: VM integration - NetBox services and reusable baseline

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/vm-netbox-integration.yml'
      - 'scripts/ci/netbox-vm-host.sh'
      - 'scripts/ci/netbox-vm-guest.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build credential-free NetBox VM baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: bash -n scripts/ci/netbox-vm-host.sh scripts/ci/netbox-vm-guest.sh
      - name: Install virtualization tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Prepare Ubuntu VM with real NetBox dependencies
        run: bash scripts/ci/netbox-vm-host.sh build
      - name: Share baseline with separate verification runner
        uses: actions/upload-artifact@v4
        with:
          name: netbox-ubuntu24-baseline
          path: |
            ${{ runner.temp }}/netbox-ci/netbox-ubuntu24.qcow2
            ${{ runner.temp }}/netbox-ci/SHA256SUMS.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  verify:
    name: Boot NetBox twice from reusable baseline
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install virtualization tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Download prepared baseline
        uses: actions/download-artifact@v4
        with:
          name: netbox-ubuntu24-baseline
          path: ${{ runner.temp }}/netbox-ci
      - name: Verify two isolated NetBox boots
        run: bash scripts/ci/netbox-vm-host.sh verify
