name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated release tag (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build Linux archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release tag such as v0.5.0'
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"

      - name: Build and validate release archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          bash -n scripts/build-release.sh
          bash scripts/build-release.sh "$RELEASE_TAG"
          archive="dist/netbox-ops-${RELEASE_TAG}.tar.gz"

          gzip -t "$archive"
          tar -tzf "$archive" > "$RUNNER_TEMP/netbox-ops-release-files"
          grep -Fxq 'netbox-ops/install.sh' "$RUNNER_TEMP/netbox-ops-release-files"
          grep -Fxq 'netbox-ops/upgrade.sh' "$RUNNER_TEMP/netbox-ops-release-files"
          grep -Fxq 'netbox-ops/netbox_ops.py' "$RUNNER_TEMP/netbox-ops-release-files"
          if grep -Eq '^netbox-ops/(\.github/|tests/|scripts/)' "$RUNNER_TEMP/netbox-ops-release-files"; then
            echo 'Unexpected development files in release archive'
            exit 1
          fi

          extracted="$(mktemp -d)"
          trap 'rm -rf -- "$extracted"' EXIT
          tar -xzf "$archive" -C "$extracted"
          test -x "$extracted/netbox-ops/install.sh"
          test -x "$extracted/netbox-ops/upgrade.sh"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: netbox-ops-${{ inputs.tag }}
          path: dist/netbox-ops-${{ inputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
