name: Experimental KVM benchmark (#223)

on:
  push:
    branches: [perf/223-kvm-benchmark]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Cross-minor / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: A-control
            vcpus: 2
            memory: 4096
          - profile: B-cpu
            vcpus: 3
            memory: 4096
          - profile: C-memory
            vcpus: 2
            memory: 8192
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate and record source
        run: |
          set -euo pipefail
          git rev-parse HEAD
          bash -n scripts/ci/netbox-vm-host.sh scripts/ci/netbox-vm-guest.sh scripts/ci/netbox-vm-upgrade-e2e.sh
          source scripts/ci/netbox-vm-baseline.env
          [[ "$BASELINE_TAG" =~ ^netbox-ubuntu2404-netbox[0-9]+-schema-v[0-9]+$ ]]
          echo "Pinned baseline: $BASELINE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Install virtualization tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Download and verify versioned baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/netbox-vm-baseline.env
          mkdir -p "$RUNNER_TEMP/netbox-ci"
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/netbox-ci" --pattern netbox-ubuntu24.qcow2 --pattern SHA256SUMS.txt
          cd "$RUNNER_TEMP/netbox-ci"
          test -s netbox-ubuntu24.qcow2
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Run identical cross-minor scenario
        env:
          NETBOX_VM_UPGRADE_SCENARIO: cross-minor
          NETBOX_VM_VCPUS: ${{ matrix.vcpus }}
          NETBOX_VM_MEMORY_MIB: ${{ matrix.memory }}
        run: |
          set -euo pipefail
          bash scripts/ci/netbox-vm-host.sh verify | tee "$RUNNER_TEMP/benchmark.log"
      - name: Report phase timing
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/benchmark.log"; then
            grep -E '^(VM profile:|TIMING:|PASS: QMP|PASS: isolated NetBox boot)' "$RUNNER_TEMP/benchmark.log" >> "$GITHUB_STEP_SUMMARY" || true
          fi
