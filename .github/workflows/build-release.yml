name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Planned stable release tag (e.g. v0.6.0)'
        required: true
        type: string
      publish:
        description: 'Publish after validation (creates tag and GitHub Release)'
        type: boolean
        required: true
        default: false

# Serialize all release candidates and publication attempts across versions.
concurrency:
  group: netbox-ops-release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Check planned tag and source branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          test "$SOURCE_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

  tests:
    needs: preflight
    uses: ./.github/workflows/tests.yml

  package:
    name: Validate and build release candidate
    needs: [preflight, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/build-release.sh
          bash scripts/build-release.sh
          archive="dist/netbox-ops-$RELEASE_TAG.tar.gz"
          python3 scripts/release-candidate.py validate "$archive" "$RELEASE_TAG"

      - name: Upload validated release candidate
        uses: actions/upload-artifact@v4
        with:
          name: netbox-ops-${{ inputs.tag }}
          path: |
            dist/netbox-ops-${{ inputs.tag }}.tar.gz
            dist/netbox-ops-${{ inputs.tag }}.tar.gz.sha256
            dist/netbox-ops-${{ inputs.tag }}.compatibility.json
            dist/netbox-ops-${{ inputs.tag }}.notes.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish validated release
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: [preflight, tests, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download validated assets from this run
        uses: actions/download-artifact@v4
        with:
          name: netbox-ops-${{ inputs.tag }}
          path: dist

      - name: Verify and publish the release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py "$RELEASE_TAG" "dist/netbox-ops-$RELEASE_TAG.tar.gz"
