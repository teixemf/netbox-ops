name: Coverage baseline (issue 159)

# Temporary, non-blocking experiment for the next release. Do not merge
# this branch-specific trigger into dev.
on:
  push:
    branches: ['ci/159-coverage-baseline']

permissions:
  contents: read

jobs:
  baseline:
    name: Python 3.12 / full unittest coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/netbox-ops-coverage"
      - name: Measure full Python unit and regression suite
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --volume "$RUNNER_TEMP/netbox-ops-coverage:/coverage" \
            --workdir /workspace \
            --env COVERAGE_FILE=/coverage/.coverage \
            python:3.12-bookworm \
            bash -ec 'set -o pipefail
              git config --global --add safe.directory /workspace
              python -m pip install --disable-pip-version-check coverage==7.10.7 diff-cover==10.6.0
              bash -n install.sh upgrade.sh uninstall.sh
              python -m coverage run --branch --source=netbox_ops -m unittest discover -s tests -p "test_*.py" -v
              python -m coverage report -m | tee /coverage/coverage.txt
              python -m coverage xml -o /coverage/coverage.xml
              python -m coverage json -o /coverage/coverage.json
              python -m coverage html -d /coverage/html
              bash scripts/ci/coverage-diff-smoke.sh /coverage
              python scripts/ci/coverage_diff.py --base f9b31d3a43a6ee4143219a04c5a8031cb3173a97 --coverage /coverage/coverage.json --output /coverage/diff-guarded.json | tee /coverage/diff-guarded.txt'
      - name: Publish coverage summary
        if: success()
        run: |
          {
            echo '### Python 3.12 unit and regression coverage'
            echo 'No coverage threshold is enforced in this experiment.'
            echo 'Integration and VM E2E coverage are not included.'
            echo '~~~text'
            cat "$RUNNER_TEMP/netbox-ops-coverage/coverage.txt"
            cat "$RUNNER_TEMP/netbox-ops-coverage/coverage-totals.txt"
            cat "$RUNNER_TEMP/netbox-ops-coverage/diff-experiment.txt"
            cat "$RUNNER_TEMP/netbox-ops-coverage/diff-guarded.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline-python-3.12
          path: ${{ runner.temp }}/netbox-ops-coverage/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30

  postgres-coverage:
    name: PostgreSQL coverage / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
            artifact: ubuntu-22.04
          - distro: Rocky Linux 9
            image: rockylinux:9
            artifact: rocky-9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/netbox-ops-postgres-coverage"
      - name: Measure existing real PostgreSQL tests
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --volume "$RUNNER_TEMP/netbox-ops-postgres-coverage:/coverage" \
            --workdir /workspace \
            --env COVERAGE_FILE=/coverage/.coverage \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "${{ matrix.image }}" \
            bash -ec 'set -o pipefail
              source /etc/os-release
              case "$ID" in
                ubuntu)
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update -qq
                  apt-get install -y -qq --no-install-recommends python3-pip
                  ;;
                rocky)
                  dnf install -y --setopt=install_weak_deps=False python3-pip
                  ;;
                *) exit 1 ;;
              esac
              python3 -m pip install --disable-pip-version-check --target /tmp/nbo-coverage-tool coverage==7.10.7
              export PYTHONPATH=/tmp/nbo-coverage-tool
              python3 --version | tee /coverage/python-version.txt
              bash tests/integration/run_postgres.sh python3 -m coverage run --branch --source=netbox_ops -m unittest discover -s tests/integration -p "integration_*.py" -v
              python3 -m coverage report -m | tee /coverage/coverage.txt
              python3 -m coverage json -o /coverage/coverage.json
              python3 -m coverage xml -o /coverage/coverage.xml'
      - name: Publish integration coverage summary
        if: success()
        run: |
          {
            echo '### PostgreSQL integration coverage (separate measurement)'
            echo 'Uses the distribution Python; do not add percentages to the unit baseline.'
            echo '~~~text'
            cat "$RUNNER_TEMP/netbox-ops-postgres-coverage/python-version.txt"
            cat "$RUNNER_TEMP/netbox-ops-postgres-coverage/coverage.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PostgreSQL coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-postgres-${{ matrix.artifact }}
          path: ${{ runner.temp }}/netbox-ops-postgres-coverage/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30
