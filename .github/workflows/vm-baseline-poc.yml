name: VM baseline PoC - Ubuntu 22.04

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-baseline:
    name: Build and publish QCOW2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
    steps:
      - name: Install QEMU tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Build clean Ubuntu baseline
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vm-baseline-build"
          cd "$RUNNER_TEMP/vm-baseline-build"
          echo "BUILD_DIR=$PWD" >> "$GITHUB_ENV"

          image=ubuntu-22.04-server-cloudimg-amd64.img
          url=https://cloud-images.ubuntu.com/releases/jammy/release
          started=$SECONDS
          curl -fLsS --retry 3 -o "$image" "$url/$image"
          curl -fLsS --retry 3 -o SHA256SUMS "$url/SHA256SUMS"
          grep -F " *$image" SHA256SUMS | sha256sum -c -
          echo "Official image download and checksum: $((SECONDS-started)) s"

          qemu-img create -f qcow2 -F qcow2 -b "$PWD/$image" overlay.qcow2
          ssh-keygen -q -t ed25519 -N '' -C "vm-poc-build-$GITHUB_RUN_ID" -f build_key
          cat > user-data <<EOF
          #cloud-config
          users:
            - default
          ssh_authorized_keys:
            - $(cat build_key.pub)
          ssh_pwauth: false
          write_files:
            - path: /etc/netbox-ops-baseline
              permissions: '0644'
              content: ubuntu-22.04-poc-v1
          EOF
          cat > meta-data <<EOF
          instance-id: vm-poc-build-$GITHUB_RUN_ID
          local-hostname: vm-poc-build
          EOF
          cloud-localds seed.img user-data meta-data

          cleanup() {
            if [[ -f vm.pid ]]; then
              kill "$(cat vm.pid)" 2>/dev/null || true
            fi
            if [[ "$?" != 0 && -f serial.log ]]; then
              tail -n 80 serial.log || true
            fi
          }
          trap cleanup EXIT

          if [[ ! -c /dev/kvm ]]; then
            echo '::error::KVM is unavailable'
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          boot_start=$SECONDS
          qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 2 -m 2048 \
            -drive file=overlay.qcow2,format=qcow2,if=virtio,discard=unmap \
            -drive file=seed.img,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -display none -serial file:serial.log -monitor none \
            -daemonize -pidfile vm.pid

          ssh_opts=(-i ./build_key -p 2222 -o BatchMode=yes -o ConnectTimeout=3 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=./known_hosts)
          ready=false
          for i in {1..90}; do
            if ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 true 2>/dev/null; then
              ready=true
              break
            fi
            sleep 3
          done
          if [[ "$ready" != true ]]; then
            echo '::error::Baseline build VM failed to start'
            exit 1
          fi
          timeout 180 ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 'sudo cloud-init status --wait'
          ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 \
            'test "$(cat /etc/netbox-ops-baseline)" = ubuntu-22.04-poc-v1'
          echo "Build VM boot and cloud-init: $((SECONDS-boot_start)) s"

          # No private SSH key is ever copied into the guest. Remove ephemeral
          # authorized keys, SSH host keys and instance cache before publishing.
          ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 \
            'sudo cloud-init clean --logs --machine-id && sudo rm -rf /home/ubuntu/.ssh /root/.ssh && sudo rm -f /etc/ssh/ssh_host_* && sudo sync && sudo fstrim -v / && sudo test ! -e /etc/ssh/ssh_host_ed25519_key && sudo test ! -e /home/ubuntu/.ssh/authorized_keys'
          ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 'sudo poweroff' || true

          vm_pid=$(cat vm.pid)
          stopped=false
          for i in {1..90}; do
            state=$(ps -o stat= -p "$vm_pid" 2>/dev/null || true)
            if [[ -z "$state" || "$state" == Z* ]]; then
              stopped=true
              break
            fi
            sleep 1
          done
          if [[ "$stopped" != true ]]; then
            echo '::error::Guest did not shut down cleanly'
            exit 1
          fi

          started=$SECONDS
          qemu-img convert -c -O qcow2 overlay.qcow2 ubuntu-22.04-poc-baseline.qcow2
          qemu-img check ubuntu-22.04-poc-baseline.qcow2
          bytes=$(stat -c %s ubuntu-22.04-poc-baseline.qcow2)
          if (( bytes >= 2147483648 )); then
            echo '::error::QCOW2 exceeds GitHub Releases 2 GiB asset limit'
            exit 1
          fi
          sha256sum ubuntu-22.04-poc-baseline.qcow2 > SHA256SUMS.txt
          echo "Standalone compressed QCOW2: $bytes bytes, conversion $((SECONDS-started)) s"
          echo "PASS: Guest sanitised and baseline image created"

      - name: Publish test prerelease
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          tag="vm-poc-ubuntu2204-$GITHUB_RUN_ID"
          gh release create "$tag" ubuntu-22.04-poc-baseline.qcow2 SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "VM PoC Ubuntu 22.04 ($GITHUB_RUN_ID)" \
            --notes "Test-only Ubuntu 22.04 QCOW2 baseline for GitHub Actions. No NetBox or credentials."
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Baseline release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  verify-baseline:
    name: Download and verify isolated boots
    needs: publish-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Install QEMU tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Download GitHub Release and boot twice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-baseline.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vm-baseline-verify"
          cd "$RUNNER_TEMP/vm-baseline-verify"
          download_start=$SECONDS
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ubuntu-22.04-poc-baseline.qcow2' \
            --pattern 'SHA256SUMS.txt'
          sha256sum -c SHA256SUMS.txt
          download_seconds=$((SECONDS-download_start))
          base_hash=$(sha256sum ubuntu-22.04-poc-baseline.qcow2 | cut -d' ' -f1)
          echo "GitHub Release download and checksum: $download_seconds s"

          if [[ ! -c /dev/kvm ]]; then
            echo '::error::KVM is unavailable on the verification runner'
            exit 1
          fi
          sudo chmod a+rw /dev/kvm

          cleanup() {
            if [[ -f vm.pid ]]; then
              kill "$(cat vm.pid)" 2>/dev/null || true
            fi
            if [[ -f serial.log ]]; then
              tail -n 80 serial.log || true
            fi
          }
          trap cleanup ERR EXIT

          for attempt in 1 2; do
            started=$SECONDS
            qemu-img create -f qcow2 -F qcow2 \
              -b "$PWD/ubuntu-22.04-poc-baseline.qcow2" \
              "overlay-$attempt.qcow2"
            ssh-keygen -q -t ed25519 -N '' -C "vm-poc-verify-$attempt" -f "key-$attempt"
            cat > user-data <<EOF
          #cloud-config
          users:
            - default
          ssh_authorized_keys:
            - $(cat "key-$attempt.pub")
          ssh_pwauth: false
          ssh_deletekeys: true
          EOF
            cat > meta-data <<EOF
          instance-id: vm-poc-verify-$GITHUB_RUN_ID-$attempt
          local-hostname: vm-poc-verify-$attempt
          EOF
            cloud-localds "seed-$attempt.img" user-data meta-data
            rm -f vm.pid serial.log
            qemu-system-x86_64 \
              -machine q35,accel=kvm -cpu host -smp 2 -m 2048 \
              -drive file="overlay-$attempt.qcow2",format=qcow2,if=virtio \
              -drive file="seed-$attempt.img",format=raw,if=virtio \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              -display none -serial file:serial.log -monitor none \
              -daemonize -pidfile vm.pid

            ssh_opts=(-i "./key-$attempt" -p 2222 -o BatchMode=yes \
              -o ConnectTimeout=3 -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="./known-hosts-$attempt")
            ready=false
            for i in {1..90}; do
              if ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 true 2>/dev/null; then
                ready=true
                break
              fi
              sleep 3
            done
            if [[ "$ready" != true ]]; then
              echo "::error::Boot $attempt failed"
              exit 1
            fi
            ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 'sudo cloud-init status --wait'
            ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 \
              'set -eu; . /etc/os-release; test "$VERSION_ID" = 22.04; test "$(cat /etc/netbox-ops-baseline)" = ubuntu-22.04-poc-v1; ! grep -q vm-poc-build- /home/ubuntu/.ssh/authorized_keys'
            if [[ "$attempt" == 1 ]]; then
              ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 'sudo touch /etc/netbox-ops-test-change'
            else
              ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 'test ! -e /etc/netbox-ops-test-change'
            fi
            echo "PASS: Boot $attempt validated in $((SECONDS-started)) s"

            ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 'sudo poweroff' || true
            vm_pid=$(cat vm.pid)
            stopped=false
            for i in {1..90}; do
              state=$(ps -o stat= -p "$vm_pid" 2>/dev/null || true)
              if [[ -z "$state" || "$state" == Z* ]]; then
                stopped=true
                break
              fi
              sleep 1
            done
            if [[ "$stopped" != true ]]; then
              echo "::error::Boot $attempt failed to shut down"
              exit 1
            fi
            rm -f "overlay-$attempt.qcow2" vm.pid
          done

          test "$base_hash" = "$(sha256sum ubuntu-22.04-poc-baseline.qcow2 | cut -d' ' -f1)"
          echo 'PASS: Baseline hash preserved across two disposable boots'
          {
            echo '## Reusable Ubuntu 22.04 VM baseline'
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| GitHub Release | $RELEASE_TAG |"
            echo "| Download and checksum | $download_seconds s |"
            echo '| First boot and persistent marker | PASS |'
            echo '| Second boot and persistent marker | PASS |'
            echo '| First boot change missing from second boot | PASS |'
            echo '| Baseline SHA-256 unchanged | PASS |'
          } >> "$GITHUB_STEP_SUMMARY"
