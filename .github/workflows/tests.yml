name: Tests

on:
  workflow_call:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  unittest:
    name: Python ${{ matrix.python }} / unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    # Tests validate root-owned backup paths (0700); keep UID 0 inside a disposable container.
    container:
      image: python:${{ matrix.python }}-bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Check Bash syntax
        run: bash -n install.sh upgrade.sh uninstall.sh
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ruff
        run: python -m pip install ruff==0.17.6
      - name: Check Python code
        run: ruff check .
      - name: Test real audit log rotation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends logrotate
          sudo python3 -m unittest tests.install.test_logrotate -v
      - name: Check release archive
        run: |
          bash -n scripts/build-release.sh
          bash scripts/build-release.sh
          archive="$(find dist -maxdepth 1 -type f -name 'netbox-ops-v*.tar.gz' -print -quit)"
          test -n "$archive"
          tag="$(basename "$archive" .tar.gz)"
          python3 scripts/release-candidate.py validate "$archive" "${tag#netbox-ops-}"
          tar -tzf "$archive" > /tmp/netbox-ops-archive-files
          grep -Fxq 'netbox-ops/install.sh' /tmp/netbox-ops-archive-files
          grep -Fxq 'netbox-ops/netbox_ops.py' /tmp/netbox-ops-archive-files
          if grep -Eq '^netbox-ops/(\.github/|tests/|scripts/)' /tmp/netbox-ops-archive-files; then
            echo 'Unexpected development files in release archive'
            exit 1
          fi
          extracted="$(mktemp -d)"
          tar -xzf "$archive" -C "$extracted"
          test -x "$extracted/netbox-ops/install.sh"
          test -x "$extracted/netbox-ops/upgrade.sh"
          test -x "$extracted/netbox-ops/uninstall.sh"

  integration:
    name: PostgreSQL integration / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
          - distro: Rocky Linux 9
            image: rockylinux:9
    steps:
      - uses: actions/checkout@v5
      - name: Run real backup and restore tests
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            bash tests/integration/run_postgres.sh \
              python3 -m unittest discover -s tests/integration \
              -p 'integration_*.py' -v
